name: "Release WF"

on:
  push:
    tags:
    - "*"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v6.5.0
      with:
        go-version-file: 'go.mod'
    - uses: goreleaser/goreleaser-action@v7.2.2
      with:
        version: '2.16.0'
        args: "release --clean"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
